<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 1등급 문제 공작소 - Test Factory</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        :root {
            --bg-body: #F1F5F9; --bg-surface: #FFFFFF;
            --text-main: #0F172A; --text-sub: #475569;
            --accent-primary: #4F46E5;
            --accent-killer: #E11D48;
            --accent-fusion: #7C3AED;
            --border-soft: #CBD5E1;
            --shadow-box: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius-box: 16px; --radius-btn: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        .app-container { display: flex; max-width: 1400px; margin: 0 auto; min-height: 100vh; }
        
        .sidebar { width: 280px; background: var(--bg-surface); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: 30px 0; }
        .brand { padding: 0 30px 20px; font-size: 1.5rem; font-weight: 900; color: var(--accent-primary); display: flex; align-items: center; gap: 10px; }
        .menu-label { padding: 0 30px; font-size: 0.8rem; font-weight: 800; color: var(--text-sub); margin-bottom: 10px; margin-top: 20px; text-transform: uppercase; }
        .menu-item { padding: 12px 30px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-sub); transition: 0.2s; position: relative; }
        .menu-item:hover { color: var(--accent-primary); background: #EEF2FF; }
        .menu-item.active { color: var(--accent-primary); background: #E0E7FF; font-weight: 800; }
        .menu-item.active::before { content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px; background: var(--accent-primary); border-radius: 0 4px 4px 0; }
        .settings-section { margin-top: auto; padding: 20px 30px; border-top: 1px solid var(--border-soft); background: #F8FAFC; }
        .settings-section input { width: 100%; padding: 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-btn); }
        
        .main-content { flex: 1; padding: 40px; max-width: 950px; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
        .page-icon { background: var(--accent-primary); color: white; width: 60px; height: 60px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }
        .page-title { font-size: 1.8rem; font-weight: 900; }
        .page-desc { color: var(--text-sub); }
        
        .panel { background: var(--bg-surface); padding: 35px; border-radius: var(--radius-box); box-shadow: var(--shadow-box); margin-bottom: 30px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 0.95rem; }
        input[type="text"], textarea, select { width: 100%; padding: 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-btn); font-family: inherit; font-size: 1rem; background: #F8FAFC; transition: 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-primary); background: #FFF; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .upload-zone { border: 2px dashed #94A3B8; padding: 25px; text-align: center; border-radius: var(--radius-btn); cursor: pointer; background: #F8FAFC; position: relative; transition: 0.3s; }
        .upload-zone:hover { border-color: var(--accent-primary); background: #EEF2FF; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .btn-primary { background: var(--accent-primary); color: white; border: none; padding: 16px 24px; border-radius: var(--radius-btn); font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }
        .action-bar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
        .btn-action { padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; border: none; color: white; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-reveal { background: var(--accent-killer); } .btn-reveal:hover { background: #BE123C; }
        .btn-pdf { background: var(--text-main); } .btn-pdf:hover { background: #334155; }
        .btn-del { background: #EF4444; } .btn-del:hover { background: #DC2626; }
        
        .document-wrapper { display: none; }
        .document-view { background: white; padding: 50px; border-radius: var(--radius-box); box-shadow: var(--shadow-box); line-height: 1.8; color: #1E293B; font-size: 1.05rem; }
        .document-view h2 { margin: 30px 0 15px; font-weight: 900; color: var(--accent-primary); border-bottom: 2px solid var(--border-soft); padding-bottom: 10px; }
        .document-view h3 { margin: 25px 0 10px; font-weight: 800; color: var(--text-main); }
        .document-view strong { background: rgba(79, 70, 229, 0.1); padding: 0 4px; border-radius: 4px; font-weight: 900; }
        .document-view blockquote { border-left: 4px solid var(--accent-killer); background: #FFF1F2; padding: 15px 20px; margin: 20px 0; font-weight: 700; color: #9F1239; }
        .answer-section { display: none; border-top: 3px dashed var(--border-soft); margin-top: 40px; padding-top: 30px; }
        
        .loader { display: none; text-align: center; padding: 30px; font-weight: 800; color: var(--accent-primary); }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border-soft); border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { display: none; padding: 15px; background: #FEF2F2; color: #EF4444; border: 2px dashed #EF4444; border-radius: var(--radius-btn); margin-top: 15px; font-weight: 800; }
        
        .archive-list { display: flex; flex-direction: column; gap: 15px; }
        .archive-item { background: white; padding: 20px; border-radius: var(--radius-box); box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-soft); transition: 0.2s; }
        .archive-item:hover { border-color: var(--accent-primary); transform: translateY(-2px); box-shadow: 0 8px 15px rgba(79, 70, 229, 0.1); }
        .archive-info { flex: 1; cursor: pointer; }
        .archive-title { font-size: 1.15rem; font-weight: 900; margin-bottom: 5px; }
        .archive-meta { font-size: 0.85rem; color: var(--text-sub); }
        .tag-badge { background: #E2E8F0; padding: 3px 8px; border-radius: 4px; margin-right: 5px; font-weight: 700; }
        
        @media (max-width: 768px) { .form-row { flex-direction: column; gap: 0; } .sidebar { display: none; } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <nav class="sidebar no-print">
            <div class="brand"><i class="fa-solid fa-flask"></i> Test Factory</div>
            <div class="menu-label">Create Test</div>
            <div class="menu-item active" onclick="navTo('single')"><i class="fa-solid fa-file-pen"></i> 문제 출제소 (단일)</div>
            <div class="menu-item" onclick="navTo('fusion')"><i class="fa-solid fa-fire-flame-curved"></i> 융합형 킬러 보스전</div>
            
            <div class="menu-label">Storage</div>
            <div class="menu-item" onclick="navTo('archive')"><i class="fa-solid fa-box-archive"></i> 모의고사 보관함</div>
            
            <div class="settings-section">
                <label><i class="fa-solid fa-key"></i> Gemini API Key</label>
                <input type="password" id="sysApiKey" placeholder="API Key 입력" onchange="saveApiKey()">
            </div>
        </nav>

        <main class="main-content">
            <!-- 1. 단일 지문 문제 생성 -->
            <section id="page-single" class="page-section active">
                <div class="page-header">
                    <div class="page-icon"><i class="fa-solid fa-file-pen"></i></div>
                    <div>
                        <h2 class="page-title">문제 출제소</h2>
                        <p class="page-desc">하나의 개념이나 지문을 바탕으로 다양한 실전 워크북용 문제를 출제합니다.</p>
                    </div>
                </div>
                
                <div class="panel no-print" id="singlePanel">
                    <div class="form-row">
                        <div class="form-group">
                            <label>시험지 제목</label>
                            <input type="text" id="singleTitle" placeholder="예: 문학 작품 기출 변형">
                        </div>
                        <div class="form-group">
                            <label>과목/태그</label>
                            <input type="text" id="singleTags" placeholder="예: 국어, 문학">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>출제할 문제 유형 선택</label>
                        <select id="singleType">
                            <option value="concept">개념 확인용 (O/X 5제 + 단답형 3제)</option>
                            <option value="hard_mcq">고난도 선지 타파 (매력적 오답이 포함된 5지선다 3제)</option>
                            <option value="killer">수능형 킬러 문제 (ㄱ, ㄴ, ㄷ 합답형 고난도 1제)</option>
                            <option value="essay">확장 서술형 (논리적 근거를 묻는 서술형 2제)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>출제 기반이 될 텍스트/지문</label>
                        <textarea id="singlePrompt" rows="6" placeholder="분석할 문학 작품, 수학 개념, 또는 외국어 텍스트 등을 자유롭게 붙여넣으세요."></textarea>
                    </div>
                    <div class="form-group">
                        <label>교재 사진/PDF 첨부 (선택)</label>
                        <div class="upload-zone">
                            <input type="file" id="singleFile" accept="image/*,.pdf,.txt" onchange="handleFile('singleFile', 'singlePreview')">
                            <i class="fa-solid fa-file-arrow-up" style="font-size:2rem; color:#94A3B8; margin-bottom:10px;"></i>
                            <div>클릭하여 파일 첨부</div>
                            <div id="singlePreview" style="display:none; color:var(--accent-primary); font-weight:bold; margin-top:10px;"></div>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="generateTest('single')"><i class="fa-solid fa-hammer"></i> 깐깐한 문제 출제 시작</button>
                    <div id="singleError" class="error-box"></div>
                </div>
                
                <div id="singleLoader" class="loader"><div class="spinner"></div>AI 출제위원이 고난도 함정을 섞어 출제 중입니다...</div>
                
                <div id="singleResultWrapper" class="document-wrapper">
                    <div class="action-bar no-print">
                        <button class="btn-action btn-reveal" onclick="revealAnswer('pdfSingle')"><i class="fa-solid fa-unlock-keyhole"></i> 정답/해설 보기</button>
                        <button class="btn-action btn-pdf" onclick="downloadPDF('pdfSingle', '실전모의고사')"><i class="fa-solid fa-file-pdf"></i> PDF 저장</button>
                    </div>
                    <div id="pdfSingle" class="document-view">
                        <div id="singleQuestionArea"></div>
                        <div class="answer-section" id="singleAnswerArea"></div>
                    </div>
                </div>
            </section>

            <!-- 2. 융합형 킬러 보스전 -->
            <section id="page-fusion" class="page-section">
                <div class="page-header">
                    <div class="page-icon" style="background: var(--accent-fusion);"><i class="fa-solid fa-fire-flame-curved"></i></div>
                    <div>
                        <h2 class="page-title">융합형 킬러 보스전</h2>
                        <p class="page-desc">2개의 전혀 다른 개념을 엮어 수능 20번 급의 초고난도 추론 문제를 생성합니다.</p>
                    </div>
                </div>
                
                <div class="panel no-print" id="fusionPanel">
                    <div class="form-group">
                        <label><i class="fa-solid fa-1"></i> 첫 번째 개념/지문 (Base)</label>
                        <textarea id="fusionPrompt1" rows="4" placeholder="예: 특정 작품의 사회적 편견 양상"></textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-2"></i> 두 번째 개념/지문 (Target)</label>
                        <textarea id="fusionPrompt2" rows="4" placeholder="예: 다른 작품에서의 인간의 욕망과 타락"></textarea>
                    </div>
                    <button class="btn-primary" style="background: var(--accent-fusion);" onclick="generateTest('fusion')"><i class="fa-solid fa-skull"></i> 융합 킬러 문항 생성</button>
                    <div id="fusionError" class="error-box"></div>
                </div>
                
                <div id="fusionLoader" class="loader" style="color:var(--accent-fusion);"><div class="spinner"></div>두 개념을 완벽히 융합하여 악랄한 문항을 출제 중입니다...</div>
                
                <div id="fusionResultWrapper" class="document-wrapper">
                    <div class="action-bar no-print">
                        <button class="btn-action btn-reveal" onclick="revealAnswer('pdfFusion')"><i class="fa-solid fa-unlock-keyhole"></i> 정답/해설 보기</button>
                        <button class="btn-action btn-pdf" onclick="downloadPDF('pdfFusion', '융합킬러문항')"><i class="fa-solid fa-file-pdf"></i> PDF 저장</button>
                    </div>
                    <div id="pdfFusion" class="document-view">
                        <div id="fusionQuestionArea"></div>
                        <div class="answer-section" id="fusionAnswerArea"></div>
                    </div>
                </div>
            </section>

            <!-- 3. 모의고사 보관함 -->
            <section id="page-archive" class="page-section">
                <div class="page-header">
                    <div class="page-icon" style="background: #10B981;"><i class="fa-solid fa-box-archive"></i></div>
                    <div>
                        <h2 class="page-title">모의고사 보관함</h2>
                        <p class="page-desc">내가 생성한 모든 시험지와 해설을 영구적으로 보관합니다.</p>
                    </div>
                </div>
                <div id="archiveList" class="archive-list"></div>
            </section>
        </main>
    </div>

    <script>
        // 용량 제한 해결을 위해 IndexedDB 사용
        localforage.config({ name: 'TestFactory', storeName: 'TestVault' });

        window.onload = () => {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) document.getElementById('sysApiKey').value = savedKey;
        };

        function saveApiKey() { localStorage.setItem('geminiApiKey', document.getElementById('sysApiKey').value); }

        function navTo(pageId) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            
            // 탭 이동 시 입력 패널 복구
            if(pageId === 'single') document.getElementById('singlePanel').style.display = 'block';
            if(pageId === 'fusion') document.getElementById('fusionPanel').style.display = 'block';
            if(pageId === 'archive') loadArchive();
        }

        function handleFile(inputId, previewId) {
            const file = document.getElementById(inputId).files[0];
            if (file) {
                const preview = document.getElementById(previewId);
                preview.style.display = 'block';
                preview.innerText = `첨부 완료: ${file.name}`;
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ data: reader.result.split(',')[1], mimeType: file.type });
                reader.onerror = error => reject(error);
            });
        }

        function revealAnswer(containerId) {
            const answerArea = document.getElementById(containerId).querySelector('.answer-section');
            if (answerArea) {
                answerArea.style.display = 'block';
                answerArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function downloadPDF(elementId, fileName) {
            const element = document.getElementById(elementId);
            const answerArea = element.querySelector('.answer-section');
            
            const originalDisplay = answerArea ? answerArea.style.display : 'block';
            if (answerArea) answerArea.style.display = 'block'; // PDF 생성 전 해설 강제 노출

            const opt = {
                margin: [15, 12, 15, 12], 
                filename: `${fileName}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 1.5, useCORS: true },
                pagebreak: { mode: ['css', 'legacy'] },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                if (answerArea) answerArea.style.display = originalDisplay; // 상태 복구
            });
        }

        // 아주 엄격한 프롬프트 규칙 세팅 (API 에러 원천 차단)
        const STRICT_RULES = `
[출제자 절대 준수 규칙 - 시스템 에러 방지용]
1. 글머리 기호 작성 시 하이픈(-)이나 화살표(=>, ->)를 절대 사용하지 마세요. 폰트가 깨집니다. 별표(*)나 숫자(1. 2. 3.)만 허용됩니다.
2. 수식을 쓸 때는 반드시 이중 달러 기호($$수식$$)를 사용하세요. 단일 달러 기호($)는 절대 금지됩니다.
3. [가장 중요] 문제 출제가 모두 끝난 후, 반드시 새 줄에 '====ANSWER====' 라는 문자열을 정확히 한 번만 삽입하세요.
4. '====ANSWER====' 문자열 아래에는 위에서 출제한 모든 문제의 정답과 상세한 해설(오답의 이유 포함)을 꼼꼼하게 작성하세요.
5. 출제된 문제의 퀄리티는 실제 실전 워크북 수준으로 논리적이고 정교해야 합니다.`;

        // 강력한 방어 로직이 적용된 API 호출 함수
        async function callGeminiAPI(prompt, files = []) {
            const apiKey = document.getElementById('sysApiKey').value;
            if (!apiKey) throw new Error("설정 메뉴에서 API Key를 먼저 입력해주세요.");

            let parts = [{ text: prompt }];
            files.forEach(f => parts.push({ inlineData: { data: f.data, mimeType: f.mimeType } }));
            
            const options = {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: parts }], generationConfig: { temperature: 0.7 } })
            };

            // 모델명 3.6-flash 고정
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, options);
            
            if (!response.ok) {
                let errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || "서버 통신 오류 (" + response.status + ")");
            }

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            // undefined 뻗음 방지 방어 코드 3단 콤보
            if (!data.candidates || data.candidates.length === 0) {
                const blockReason = data.promptFeedback?.blockReason || "이유 알 수 없음";
                throw new Error(`구글 AI가 생성을 차단했습니다. (사유: ${blockReason}) - 텍스트에 민감한 내용이 포함되었는지 확인하세요.`);
            }
            const candidate = data.candidates[0];
            if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
                const finishReason = candidate.finishReason || "알 수 없음";
                throw new Error(`결과 생성이 중단되었습니다. (사유: ${finishReason}) - 다른 지문으로 다시 시도해주세요.`);
            }

            return candidate.content.parts[0].text;
        }

        async function generateTest(mode) {
            const loader = document.getElementById(mode + 'Loader');
            const errorBox = document.getElementById(mode + 'Error');
            const resultWrapper = document.getElementById(mode + 'ResultWrapper');
            const qArea = document.getElementById(mode + 'QuestionArea');
            const aArea = document.getElementById(mode + 'AnswerArea');
            const panel = document.getElementById(mode + 'Panel');
            
            loader.style.display = 'block'; 
            errorBox.style.display = 'none'; 
            resultWrapper.style.display = 'none';
            panel.style.display = 'none'; // 로딩 중 입력폼 숨김

            try {
                let prompt = "", title = "", files = [], tags = [];

                if (mode === 'single') {
                    title = document.getElementById('singleTitle').value || '단일 지문 실전 테스트';
                    const tagsRaw = document.getElementById('singleTags').value;
                    tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()) : ['실전 테스트'];
                    const type = document.getElementById('singleType').value;
                    const text = document.getElementById('singlePrompt').value;
                    const file = document.getElementById('singleFile').files[0];
                    
                    if (!text && !file) throw new Error("출제 기반이 될 텍스트를 입력하거나 파일을 첨부해주세요.");
                    if (file) files.push(await fileToBase64(file));

                    let typeDesc = "";
                    if(type === 'concept') typeDesc = "개념 확인용 O/X 5문제와 단답형 3문제";
                    if(type === 'hard_mcq') typeDesc = "매력적인 함정 오답이 포함된 고난도 5지선다 객관식 3문제";
                    if(type === 'killer') typeDesc = "수능 20번 수준의 고난도 <보기> 합답형 (ㄱ, ㄴ, ㄷ) 객관식 1문제";
                    if(type === 'essay') typeDesc = "논리적 인과관계를 서술해야 하는 심화 확장 서술형 2문제";

                    prompt = `당신은 꼼꼼하고 완벽을 추구하는 AI 출제 위원입니다. 제공된 지문과 개념을 바탕으로 워크북에 들어갈 [${typeDesc}]를 출제하세요.\n\n[원본 지문/개념]:\n${text}\n\n${STRICT_RULES}`;
                } 
                else if (mode === 'fusion') {
                    title = "융합형 킬러 보스전 문항";
                    tags = ["융합", "킬러", "고난도"];
                    const text1 = document.getElementById('fusionPrompt1').value;
                    const text2 = document.getElementById('fusionPrompt2').value;
                    
                    if (!text1 || !text2) throw new Error("두 개의 개념/지문을 모두 정확히 입력해야 융합 문항을 생성할 수 있습니다.");

                    prompt = `당신은 최고 난이도 문항을 설계하는 수능 출제위원입니다. 다음 완전히 다른 두 개념을 엮어서 하나의 [수능형 융합 킬러 문제(5지선다)]를 출제하세요.\n\n[개념1 (Base)]:\n${text1}\n\n[개념2 (Target)]:\n${text2}\n\n출제 지침:\n단순한 지식 나열이 아니라, 두 개념의 교집합이나 모순점, 또는 원리와 적용을 파고드는 고난도 추론 문제여야 합니다. 정답 선지 1개와 치명적이고 논리적인 오답 선지 4개를 정교하게 설계하세요.\n\n${STRICT_RULES}`;
                }

                const aiText = await callGeminiAPI(prompt, files);
                
                // 해설 분리 로직 (====ANSWER==== 기준)
                if (aiText.includes('====ANSWER====')) {
                    const parts = aiText.split('====ANSWER====');
                    qArea.innerHTML = marked.parse(parts[0].trim());
                    aArea.innerHTML = marked.parse("## 🎯 정답 및 심층 해설\n\n" + parts[1].trim());
                } else {
                    qArea.innerHTML = marked.parse(aiText);
                    aArea.innerHTML = "<p style='color:red;'>해설 영역 분리에 실패했습니다. 본문을 확인하세요.</p>";
                }

                aArea.style.display = 'none'; // 처음에 문제 푸는 동안엔 해설 가리기
                resultWrapper.style.display = 'block';

                if (window.MathJax) MathJax.typesetPromise([qArea, aArea]);

                // 보관함(IndexedDB) 자동 저장
                await saveToArchive(title, tags, aiText);

            } catch (err) {
                errorBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 출제 실패: ${err.message}`;
                errorBox.style.display = 'block';
                panel.style.display = 'block'; // 에러 시 폼 다시 표시
            } finally {
                loader.style.display = 'none';
            }
        }

        // 보관함 (Archive) 로직
        async function saveToArchive(title, tags, content) {
            let archive = await localforage.getItem('TestVault') || [];
            archive.unshift({ id: Date.now(), date: new Date().toLocaleString('ko-KR'), title, tags, content });
            await localforage.setItem('TestVault', archive);
        }

        async function loadArchive() {
            const list = document.getElementById('archiveList');
            let archive = await localforage.getItem('TestVault') || [];
            
            if (archive.length === 0) { 
                list.innerHTML = `
                <div style="text-align:center; padding:50px; background:white; border-radius:16px; border:1px dashed #CBD5E1;">
                    <i class="fa-solid fa-folder-open" style="font-size:3rem; color:#94A3B8; margin-bottom:15px;"></i>
                    <div style="color:var(--text-sub); font-weight:700;">아직 저장된 모의고사가 없습니다.</div>
                </div>`;
                return; 
            }
            
            list.innerHTML = archive.map(item => {
                let tagsHtml = (item.tags || []).map(t => `<span class="tag-badge">${t}</span>`).join('');
                return `
                <div class="archive-item">
                    <div class="archive-info" onclick="viewArchive(${item.id})">
                        <div class="archive-title">${item.title}</div>
                        <div style="margin-bottom: 8px;">${tagsHtml}</div>
                        <div class="archive-meta"><i class="fa-regular fa-clock"></i> 출제 일시: ${item.date}</div>
                    </div>
                    <div>
                        <button class="btn-action btn-del" onclick="deleteArchive(${item.id})"><i class="fa-solid fa-trash"></i> 삭제</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function viewArchive(id) {
            let archive = await localforage.getItem('TestVault') || [];
            const item = archive.find(i => i.id === id);
            if (!item) return;

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item')[0].classList.add('active'); // 1번 탭(단일문제)으로 이동
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-single').classList.add('active');
            
            document.getElementById('singlePanel').style.display = 'none'; // 폼 가리기
            
            const qArea = document.getElementById('singleQuestionArea');
            const aArea = document.getElementById('singleAnswerArea');
            
            if (item.content.includes('====ANSWER====')) {
                const parts = item.content.split('====ANSWER====');
                qArea.innerHTML = marked.parse(parts[0].trim());
                aArea.innerHTML = marked.parse("## 🎯 정답 및 심층 해설\n\n" + parts[1].trim());
            } else {
                qArea.innerHTML = marked.parse(item.content);
                aArea.innerHTML = "<p>해설 데이터가 분리되지 않았습니다.</p>";
            }
            
            aArea.style.display = 'none'; // 초기 숨김
            document.getElementById('singleResultWrapper').style.display = 'block';
            
            if (window.MathJax) MathJax.typesetPromise([qArea, aArea]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteArchive(id) {
            if(!confirm("이 모의고사를 영구적으로 삭제하시겠습니까?")) return;
            let archive = await localforage.getItem('TestVault') || [];
            archive = archive.filter(i => i.id !== id);
            await localforage.setItem('TestVault', archive);
            loadArchive(); // 목록 갱신
        }
    </script>
</body>
</html>
